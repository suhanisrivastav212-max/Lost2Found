
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact About Item | Lost2Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080d18;
            color: #f5f7ff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .contact-card {
            width: 100%;
            max-width: 600px;
            background: #111c2e;
            border: 1px solid #263c59;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 0 35px rgba(59, 130, 246, 0.08);
        }

        h1 {
            color: #60a5fa;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #aabbd2;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            color: #d7e1ef;
        }

        input, textarea {
            width: 100%;
            padding: 13px;
            background: #091322;
            border: 1px solid #30435f;
            border-radius: 9px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            border-color: #60a5fa;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #3b91f5;
            color: #061426;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #8fbaff;
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .contact-card {
                padding: 23px;
            }
        }
    </style>
</head>

<body>

    <main class="contact-card">

        <h1>I Have Information</h1>

        <p class="subtitle">
            Share information that may help the owner identify or recover this item.
        </p>

        <form id="contactForm">

            <label for="name">Your Name</label>
            <input type="text" id="name" required maxlength="80">

            <label for="email">Your Email</label>
            <input type="email" id="email" required maxlength="120">

            <label for="message">Your Message</label>
            <textarea id="message"
                placeholder="Share the information you have about this item..."
                required maxlength="1000"></textarea>

            <button type="submit">Submit Information</button>

        </form>

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>

    </main>

    
<script>
    const params = new URLSearchParams(window.location.search);
    const itemId = params.get("id");

    const form = document.getElementById("contactForm");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const senderName = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const message = document.getElementById("message").value;

        try {
            const response = await fetch("http://localhost:3000/api/messages", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    itemId: itemId,
                    senderName: senderName,
                    message: message
                })
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.message);
            }

            alert("Information sent successfully!");
            form.reset();

        } catch (error) {
            alert(error.message || "Something went wrong.");
            console.error(error);
        }
    });
</script>
</body>
</html>
