
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Items | Lost2Found</title>

    <!-- CSS -->
    <style>

           

        :root {

            --bg: #070b12;

            --bg-soft: #0b1220;

            --surface: rgba(16, 27, 43, 0.82);

            --surface-solid: #101b2b;

            --surface-hover: #14243a;

            --text: #eef7ff;

            --muted: #9aadc2;

            --blue: #b89aff;

            --blue-strong: #8a6cff;

            --blue-dim: rgba(184, 154, 255, 0.12);

            --border: rgba(184, 154, 255, 0.18);

            --glow: 0 0 36px rgba(155, 105, 255, 0.22);

            --radius: 20px;

        }

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }

        html {

            scroll-behavior: smooth;

            scroll-padding-top: 90px;

        }

        body {

            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

            background:

                radial-gradient(ellipse at 15% 0%, rgba(115, 69, 180, 0.18), transparent 38%),

                radial-gradient(ellipse at 90% 28%, rgba(99, 60, 170, 0.13), transparent 32%),

                var(--bg);

            color: var(--text);

            line-height: 1.6;

            min-height: 100vh;

            overflow-x: hidden;

        }

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            z-index: -1;

            pointer-events: none;

            opacity: 0.18;

            background-image: radial-gradient(rgba(184, 154, 255, 0.32) 0.7px, transparent 0.7px);

            background-size: 28px 28px;

            mask-image: linear-gradient(to bottom, black, transparent 78%);

        }

        a, button, input {

            -webkit-tap-highlight-color: transparent;

        }

        button {

            cursor: pointer;

            border: 1px solid transparent;

            border-radius: 12px;

            padding: 12px 18px;

            font: inherit;

            font-weight: 700;

            transition: transform .25s ease, **background** .25s ease, border-color .25s ease, box-shadow .25s ease, color .25s ease;

        }

        button:focus-visible, a:focus-visible, input:focus-visible {

            outline: 2px solid var(--blue);

            outline-offset: 4px;

        }

        /* Navbar */

        nav {

            position: sticky;

            top: 0;

            z-index: 20;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 24px;

            padding: 17px max(5%, calc((100% - 1180px) / 2));

            background: rgba(7, 11, 18, 0.78);

            border-bottom: 1px solid rgba(141, 216, 255, 0.12);

            backdrop-filter: blur(18px);

        }

        .logo {

            display: inline-flex;

            align-items: center;

            gap: 2px;

            font-size: 25px;

            font-weight: 850;

            letter-spacing: -1.1px;

            color: var(--blue);

            white-space: nowrap;

        }

        .logo span {

            color: var(--text);

        }

        .nav-links {

            display: flex;

            align-items: center;

            gap: 27px;

        }

        .nav-links a {

            position: relative;

            color: #b9c8d9;

            text-decoration: none;

            font-size: 14px;

            font-weight: 550;

            transition: color .2s ease;

        }

        .nav-links a::after {

            content: "";

            position: absolute;

            left: 0;

            right: 100%;

            bottom: -7px;

            height: 2px;

            border-radius: 10px;

            background: var(--blue);

            transition: right .25s ease;

        }

        .nav-links a:hover {

            color: var(--blue);

        }

        .nav-links a:hover::after {

            right: 0;

        }

        .primary {

            color: #06111c;

            background: linear-gradient(135deg, #b4e8ff, #68c8ff);

            box-shadow: 0 0 0 rgba(80, 191, 255, 0);

        }

        .primary:hover {

            transform: translateY(-2px);

            box-shadow: 0 8px 28px rgba(155, 105, 255, 0.30);

            background: linear-gradient(135deg, #d1f1ff, #8dd8ff);

        }

        .secondary {

            color: var(--blue);

            background: rgba(141, 216, 255, 0.045);

            border-color: rgba(184, 154, 255, 0.32);

        }

        .secondary:hover {

            transform: translateY(-2px);

            background: rgba(141, 216, 255, 0.12);

            border-color: var(--blue);

            box-shadow: 0 0 22px rgba(80, 191, 255, 0.12);

        }

        /* Hero */

        .hero {

            position: relative;

            isolation: isolate;

            padding: 100px 20px 86px;

            text-align: center;

            overflow: hidden;

            background:

                radial-gradient(ellipse at 50% 12%, rgba(58, 160, 224, 0.19), transparent 48%),

                linear-gradient(180deg, rgba(10, 19, 32, 0.75), rgba(7, 11, 18, 0.08));

        }

        .hero::before,

        .hero::after {

            content: "";

            position: absolute;

            z-index: -1;

            width: 270px;

            height: 270px;

            border-radius: 50%;

            filter: blur(85px);

            opacity: .28;

            pointer-events: none;

            animation: floatGlow 9s ease-in-out infinite alternate;

        }

        .hero::before {

            background: #167dc2;

            top: 20px;

            left: -100px;

        }

        .hero::after {

            background: #2ab8e9;

            right: -100px;

            bottom: -80px;

            animation-delay: -4s;

        }

        .tag {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 8px 14px;

            border: 1px solid rgba(141, 216, 255, 0.25);

            border-radius: 999px;

            background: rgba(141, 216, 255, 0.07);

            color: var(--blue);

            font-size: 12px;

            font-weight: 750;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            margin-bottom: 24px;

            animation: fadeUp .7s both;

        }

        .tag::before {

            content: "";

            width: 7px;

            height: 7px;

            border-radius: 50%;

            background: var(--blue);

            box-shadow: 0 0 12px var(--blue);

        }

        .hero h1 {

            font-size: clamp(39px, 6vw, 76px);

            line-height: 1.08;

            letter-spacing: -2.8px;

            font-weight: 850;

            margin-bottom: 23px;

            animation: fadeUp .8s .08s both;

        }

        .hero h1 span {

            display: inline-block;

            color: var(--blue);

            text-shadow: 0 0 34px rgba(80, 191, 255, 0.22);

        }

        .hero p {

            max-width: 620px;

            margin: 0 auto 30px;

            color: var(--muted);

            font-size: 16px;

            line-height: 1.85;

            animation: fadeUp .8s .16s both;

        }

        .hero-buttons {

            display: flex;

            justify-content: center;

            gap: 13px;

            flex-wrap: wrap;

            animation: fadeUp .8s .24s both;

        }

        .hero-buttons button {

            min-height: 48px;

            padding: 13px 22px;

        }

        /* Search */

        .search-box {

            display: flex;

            align-items: center;

            gap: 8px;

            max-width: 660px;

            margin: 34px auto 0;

            padding: 8px;

            background: rgba(15, 26, 42, 0.88);

            border: 1px solid rgba(141, 216, 255, 0.24);

            border-radius: 16px;

            box-shadow: 0 14px 50px rgba(0, 0, 0, 0.2), 0 0 30px rgba(80, 191, 255, 0.07);

            transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease;

            animation: fadeUp .8s .32s both;

        }

        .search-box:focus-within {

            border-color: rgba(141, 216, 255, 0.72);

            box-shadow: 0 0 0 4px rgba(141, 216, 255, 0.07), 0 0 35px rgba(80, 191, 255, 0.14);

        }

        .search-box input {

            flex: 1;

            min-width: 0;

            padding: 13px 14px;

            color: var(--text);

            background: transparent;

            border: none;

            outline: none;

            font: inherit;

            font-size: 14px;

        }

        .search-box input::placeholder {

            color: #71869c;

        }

        .search-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            color: #06111c;

            background: var(--blue);

            white-space: nowrap;

        }

        .search-btn:hover {

            background: #c2edff;

            box-shadow: 0 0 22px rgba(80, 191, 255, .22);

        }

        /* Items */

        .container {

            width: min(1180px, 100%);

            padding: 76px 25px 84px;

            margin: auto;

        }

        .heading {

            margin-bottom: 28px;

        }

        .heading h2,

        .how h2 {

            font-size: clamp(27px, 3.5vw, 36px);

            line-height: 1.2;

            letter-spacing: -1px;

            margin-bottom: 10px;

        }

        .heading p,

        .how-intro {

            color: var(--muted);

            font-size: 15px;

        }

        .filters {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-bottom: 27px;

        }

        .filter {

            color: #a9bbce;

            background: #0d1725;

            border: 1px solid #24384c;

            border-radius: 999px;

            padding: 9px 16px;

            font-size: 13px;

        }

        .filter:hover {

            border-color: var(--blue);

            color: var(--blue);

        }

        .filter.active {

            color: #07111c;

            background: var(--blue);

            border-color: var(--blue);

            box-shadow: 0 0 20px rgba(80, 191, 255, .16);

        }

        .cards {

            display: grid;

            grid-template-columns: repeat(3, minmax(0, 1fr));

            gap: 22px;

        }

        .card {

            position: relative;

            min-width: 0;

            overflow: hidden;

            background: linear-gradient(145deg, rgba(18, 31, 48, .98), rgba(10, 18, 30, .98));

            border: 1px solid var(--border);

            border-radius: var(--radius);

            box-shadow: 0 8px 28px rgba(0, 0, 0, .12);

            transition: transform .32s ease, border-color .32s ease, box-shadow .32s ease;

            animation: cardIn .65s both;

        }

        .card:nth-child(2) { animation-delay: .06s; }

        .card:nth-child(3) { animation-delay: .12s; }

        .card:nth-child(4) { animation-delay: .18s; }

        .card:nth-child(5) { animation-delay: .24s; }

        .card:nth-child(6) { animation-delay: .30s; }

        .card::before {

            content: "";

            position: absolute;

            inset: 0;

            opacity: 0;

            pointer-events: none;

            background: radial-gradient(circle at 50% 0%, rgba(141, 216, 255, .12), transparent 65%);

            transition: opacity .3s ease;

        }

        .card:hover {

            transform: translateY(-7px);

            border-color: rgba(141, 216, 255, .55);

            box-shadow: 0 18px 42px rgba(0, 0, 0, .25), 0 0 26px rgba(80, 191, 255, .10);

        }

        .card:hover::before {

            opacity: 1;

        }

        
.item-image {
    position: relative;
    height: 200px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-size: 67px;

    background:
        radial-gradient(circle, rgba(141, 216, 255, .14), transparent 58%),
        #0e1c2d;

    border-bottom: 1px solid rgba(141, 216, 255, .10);
    transition: background .3s ease;
}

/* Uploaded image */
.item-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}


        .card:hover .item-image {

            background:

                radial-gradient(circle, rgba(141, 216, 255, .22), transparent 60%),

                #10243a;

        }

        .card:nth-child(3n + 2) .item-image,

        .card:nth-child(3n) .item-image {

            background:

                radial-gradient(circle, rgba(141, 216, 255, .12), transparent 58%),

                #0e1c2d;

        }

        .card-content {

            position: relative;

            padding: 21px;

        }

        .badge {

            display: inline-flex;

            align-items: center;

            padding: 5px 11px;

            border-radius: 999px;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: .4px;

            margin-bottom: 12px;

            text-transform: uppercase;

        }

        .lost {

            color: #ffbd9c;

            background: rgba(255, 139, 89, .12);

            border: 1px solid rgba(255, 139, 89, .2);

        }

        .found {

            color: #8ff0c0;

            background: rgba(72, 211, 143, .10);

            border: 1px solid rgba(72, 211, 143, .2);

        }

        .card h3 {

            margin-bottom: 12px;

            font-size: 19px;

            letter-spacing: -.3px;

        }

        .details {

            display: flex;

            align-items: center;

            gap: 7px;

            color: var(--muted);

            font-size: 13px;

            margin-bottom: 8px;

        }

        .details svg {

            flex-shrink: 0;

            color: #80cfff;

        }

        .card-footer {

            border-top: 1px solid rgba(141, 216, 255, .12);

            margin-top: 18px;

            padding-top: 16px;

        }

        .card-footer button {

            width: 100%;

            font-size: 13px;

        }

        .empty {

            display: none;

            padding: 35px 20px;

            text-align: center;

            color: var(--muted);

            background: rgba(16, 27, 43, .65);

            border: 1px dashed rgba(141, 216, 255, .25);

            border-radius: 16px;

            margin-top: 20px;

        }

        /* How it works */

        .how {

            position: relative;

            padding: 78px 25px;

            text-align: center;

            background: linear-gradient(180deg, rgba(12, 22, 36, .72), rgba(7, 11, 18, .95));

            border-top: 1px solid rgba(141, 216, 255, .10);

            border-bottom: 1px solid rgba(141, 216, 255, .10);

        }

        .how h2 {

            margin-bottom: 12px;

        }

        .how-intro {

            margin-bottom: 36px;

        }

        .steps {

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 22px;

            max-width: 1060px;

            margin: auto;

        }

        .step {

            padding: 30px 24px;

            background: linear-gradient(145deg, rgba(18, 31, 48, .88), rgba(10, 18, 30, .88));

            border: 1px solid var(--border);

            border-radius: 18px;

            transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;

        }

        .step:hover {

            transform: translateY(-5px);

            border-color: rgba(141, 216, 255, .48);

            box-shadow: var(--glow);

        }

        .step .icon {

            display: inline-flex;

            width: 64px;

            height: 64px;

            align-items: center;

            justify-content: center;

            font-size: 32px;

            margin-bottom: 17px;

            border-radius: 18px;

            background: rgba(141, 216, 255, .09);

            border: 1px solid rgba(141, 216, 255, .18);

        }

        .step h3 {

            font-size: 17px;

        }

        .step p {

            color: var(--muted);

            font-size: 14px;

            margin-top: 9px;

            line-height: 1.75;

        }

        /* Footer */

        footer {

            padding: 36px 20px;

            background: #05080e;

            color: var(--text);

            text-align: center;

        }

        footer .logo {

            justify-content: center;

            font-size: 23px;

        }

        footer p {

            color: #8da0b6;

            margin-top: 7px;

            font-size: 13px;

        }

        /* Motion */

        @keyframes fadeUp {

            from { opacity: 0; transform: translateY(18px); }

            to { opacity: 1; transform: translateY(0); }

        }

        @keyframes cardIn {

            from { opacity: 0; transform: translateY(14px); }

            to { opacity: 1; transform: translateY(0); }

        }

        @keyframes floatGlow {

            from { transform: translate3d(0, 0, 0) scale(1); }

            to { transform: translate3d(24px, -18px, 0) scale(1.12); }

        }

        /* Extra premium animations */

        .hero h1 span {

            background: linear-gradient(90deg, #9c7bff, #f0eaff, #c29cff, #9c7bff);

            background-size: 240% auto;

            -webkit-background-clip: text;

            background-clip: text;

            -webkit-text-fill-color: transparent;

            animation: textShimmer 6s linear infinite;

        }

        .hero-buttons button,

        .search-btn {

            position: relative;

            overflow: hidden;

        }

        .hero-buttons button::after,

        .search-btn::after {

            content: "";

            position: absolute;

            inset: -60% auto -60% -40%;

            width: 28%;

            transform: rotate(22deg) translateX(-220%);

            background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);

            transition: transform .7s ease;

            pointer-events: none;

        }

        .hero-buttons button:hover::after,

        .search-btn:hover::after {

            transform: rotate(22deg) translateX(650%);

        }

        .card {

            transform-style: preserve-3d;

        }

        .card::after {

            content: "";

            position: absolute;

            inset: 0;

            border-radius: inherit;

            padding: 1px;

            pointer-events: none;

            opacity: 0;

            background: linear-gradient(135deg, rgba(184,154,255,.5), transparent 38%, rgba(184,154,255,.18));

            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);

            -webkit-mask-composite: xor;

            mask-composite: exclude;

            transition: opacity .35s ease;

        }

        .card:hover::after {

            opacity: 1;

        }

        .step .icon {

            transition: transform .35s ease, box-shadow .35s ease;

        }

        .step:hover .icon {

            transform: translateY(-4px) rotate(-5deg) scale(1.06);

            box-shadow: 0 0 24px rgba(155, 105, 255, .22);

        }

        /* Added by JavaScript when sections enter the viewport */

        .reveal {

            opacity: 0;

            transform: translateY(24px);

            transition: opacity .7s ease, transform .7s cubic-bezier(.2,.75,.25,1);

        }

        .reveal.is-visible {

            opacity: 1;

            transform: translateY(0);

        }

        .card.reveal {

            transition:

                opacity .65s ease,

                transform .65s cubic-bezier(.2,.75,.25,1),

                border-color .32s ease,

                box-shadow .32s ease;

        }

        @keyframes textShimmer {

            to { background-position: 240% center; }

        }

        /* Premium dark, purple-glow interface */

        .topbar{width:min(1160px,calc(100% - 40px));

            margin:10px auto 0;padding:13px 20px;border:1px solid #ffffff1a;border-radius:999px;background:#0f0f12c9;box-shadow:0 8px 36px #0003}

        .logo{text-decoration:none;gap:8px}.brand-mark{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;color:white;font-size:25px;background:linear-gradient(145deg,#a68aff,#5b42a8);box-shadow:0 0 24px #9b69ff59}

        .nav-links{gap:clamp(12px,2.2vw,30px)}.nav-links a{color:#e3e0e9;font-size:14px}.nav-chevron{color:#a79bbd;margin-left:4px}

        .nav-tools{display:flex;align-items:center;gap:10px;position:relative}.icon-btn,.avatar-btn{width:39px;height:39px;padding:0;display:grid;place-items:center;border-radius:50%;color:#f4efff;background:transparent;border:1px solid transparent;position:relative}

        .icon-btn:hover,.avatar-btn:hover{background:#ffffff17;border-color:#ffffff1f;transform:translateY(-1px)}.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

        .mobile-menu{display:none}body{background:radial-gradient(ellipse at 50% 34%,#7b4cbe38,transparent 30%),radial-gradient(ellipse at 10% 5%,#5b3d8c1a,transparent 35%),#0b0b0e}

        .hero{padding-top:88px;padding-bottom:85px}.hero::before{width:min(850px,90vw);height:600px;top:55px;background:radial-gradient(ellipse,#905bda61,#60399721 38%,transparent 70%)}.hero::after{width:1200px;height:780px;border:1px solid #bea5ff21;border-radius:50%;top:160px}

        .tag{border:1px solid #ffffff14;background:#ffffff12;color:#e9e3f2}.tag-dot{display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:#b99aff;box-shadow:0 0 12px #a27cff}

        .hero h1{max-width:850px;margin-inline:auto;font-size:clamp(42px,5.4vw,68px)}.hero p{max-width:740px}

        .primary,.search-btn{color:white;background:linear-gradient(115deg,#6e69e8,#ad78e8);box-shadow:0 8px 28px #8661e02e}.primary:hover,.search-btn:hover{background:linear-gradient(115deg,#817cff,#bd8aff);box-shadow:0 8px 28px #9b69ff4d}

        .secondary{color:#e6dcff;background:#ffffff0b;border-color:#bea5ff47}.secondary:hover{background:#a07bff21;border-color:#b89aff}

        .search-box{border-color:#bea5ff38;background:#121117e0}.card{background:linear-gradient(145deg,#191720f5,#0e0e12f5);border-color:#ffffff17}.card:hover{border-color:#b491ff73;box-shadow:0 18px 45px #0005,0 0 25px #905bda1f}

        .orbit-chip{position:absolute;z-index:2;width:56px;height:50px;padding:0;display:grid;place-items:center;color:#b89aff;background:linear-gradient(145deg,#2a2731f2,#16151af2);border:1px solid #ffffff17;border-radius:13px;box-shadow:0 10px 28px #0005,inset 0 1px #ffffff0f;animation:floatChip 4s ease-in-out infinite alternate}

        .orbit-chip svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.orbit-chip:hover{border-color:#b89aff;box-shadow:0 0 25px #9b69ff4d;transform:translateY(-4px) scale(1.04)}

        .orbit-one{right:17%;top:26%}.orbit-two{right:23%;top:56%;animation-delay:-1.5s}.orbit-three{left:7%;top:64%;animation-delay:-2.5s}

            </button>

    <main class="my-items-container">

        <h1>My Items</h1>
        <p>Manage your lost and found reports.</p>

        <div id="itemsContainer">
            <p>Loading your items...</p>
        </div>

    </main>

    <script>
        

// Get saved login token
const token = localStorage.getItem("token");

// Get items container
const itemsContainer = document.getElementById("itemsContainer");

// Load logged-in user's items
async function loadMyItems() {
    try {
        if (!token) {
            itemsContainer.innerHTML =
                "<p>Please login to view your items.</p>";
            return;
        }

        const response = await fetch(
            "http://localhost:3000/api/my-items",
            {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            }
        );

        const data = await response.json();

        if (!response.ok) {
            itemsContainer.innerHTML =
                `<p>${data.message}</p>`;
            return;
        }

        if (data.items.length === 0) {
            itemsContainer.innerHTML =
                "<p>You haven't reported any items yet.</p>";
            return;
        }

        itemsContainer.innerHTML = data.items.map(item => `
            <div class="item-card">
                <h3>${escapeHTML(item.name)}</h3>
                <p>Status: ${escapeHTML(item.status)}</p>
                <p>Location: ${escapeHTML(item.location)}</p>
                <p>${escapeHTML(item.description || "")}</p>

                <button onclick="editItem('${item._id}')">
                    Edit
                </button>

                <button onclick="deleteItem('${item._id}')">
                    Delete
                </button>
            </div>
        `).join("");

    } catch (error) {
        console.error("Load items error:", error);
        itemsContainer.innerHTML =
            "<p>Could not load items. Please try again.</p>";
    }
}

// Escape user-provided text before rendering HTML
function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

// Temporary button handlers
function editItem(id) {
    alert("Edit feature is coming next!");
}

function deleteItem(id) {
    alert("Delete feature is coming next!");
}

// Load items automatically
loadMyItems();



    </script>
