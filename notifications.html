
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications | Lost2Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #080d19;
            color: #ffffff;
            min-height: 100vh;
            padding: 30px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: #111c30;
            border: 1px solid #243653;
            border-radius: 14px;
            margin-bottom: 35px;
        }

        header h1 {
            color: #8bbcff;
            font-size: 24px;
        }

        header a {
            color: #ffffff;
            text-decoration: none;
            background: #263c60;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading h2 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .heading p {
            color: #9baac0;
        }

        .summary {
            background: #111c30;
            border: 1px solid #243653;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 25px;
        }

        .summary h3 {
            color: #8bbcff;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .summary h2 {
            font-size: 30px;
        }

        .messages-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .messages-header h3 {
            font-size: 20px;
        }

        .refresh-btn {
            background: #263c60;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .message-card {
            background: #111c30;
            border: 1px solid #243653;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 15px;
            transition: 0.3s;
        }

        .message-card:hover {
            border-color: #6ca8ff;
            transform: translateY(-3px);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .item-name {
            font-size: 19px;
            color: #a8cbff;
        }

        .status {
            background: #253c5d;
            color: #8bbcff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .message-text {
            color: #d1d9e8;
            line-height: 1.6;
            margin-bottom: 15px;
            overflow-wrap: anywhere;
        }

        .date {
            color: #8292aa;
            font-size: 13px;
        }

        .empty, .error {
            text-align: center;
            padding: 40px 15px;
            background: #111c30;
            border-radius: 14px;
            color: #aab7ca;
        }

        .error {
            color: #ff9292;
        }

        @media(max-width: 600px) {
            body {
                padding: 15px;
            }

            header {
                padding: 15px;
            }

            header h1 {
                font-size: 19px;
            }

            .heading h2 {
                font-size: 25px;
            }

            .card-top {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Lost2Found</h1>
        <a href="index.html">Home</a>
    </header>

    <main class="container">

        <section class="heading">
            <h2>Notifications</h2>
            <p>Information received about your reported items.</p>
        </section>

        <section class="summary">
            <h3>Total Received Messages</h3>
            <h2 id="totalMessages">0</h2>
            <div class="summary">
            <h3>Unread Messages</h3>
            <h2 id="unreadMessages">0</h2>
        </div>

        </section>

        <section>
            <div class="messages-header">
                <h3>Received Messages</h3>
                <button class="refresh-btn" onclick="loadMessages()">
                    Refresh
                </button>
            </div>

            <div id="messagesContainer">
                <p class="empty">Loading messages...</p>
            </div>
        </section>

    </main>

    <script>
        const messagesContainer =
            document.getElementById("messagesContainer");

        const totalMessages =
            document.getElementById("totalMessages");

            const unreadMessages =
    document.getElementById("unreadMessages");


        async function loadMessages() {

            messagesContainer.innerHTML =
                '<p class="empty">Loading messages...</p>';

            try {

                const response = await fetch(
                    "http://localhost:3000/api/messages"
                );

                if (!response.ok) {
                    throw new Error("Could not fetch messages.");
                }

                const messages = await response.json();

totalMessages.textContent = messages.length;

const unreadCount = messages.filter(
    message => message.status !== "Read"
).length;

unreadMessages.textContent = unreadCount;

if (messages.length === 0) {

    messagesContainer.innerHTML =
        '<p class="empty">No messages received yet.</p>';

    return;
}
                
messagesContainer.innerHTML = "";

messages.forEach(function(message) {

    const card = document.createElement("article");
    card.className = "message-card";

    const top = document.createElement("div");
    top.className = "card-top";

    const itemName = document.createElement("h3");
    itemName.className = "item-name";
    itemName.textContent =
        message.itemName || "Unknown Item";

    const status = document.createElement("span");
    status.className = "status";
    status.textContent = message.status || "New";

    top.appendChild(itemName);
    top.appendChild(status);

    const messageText = document.createElement("p");
    messageText.className = "message-text";
    messageText.textContent =
        message.message || "No message available.";

    const date = document.createElement("p");
    date.className = "date";

    date.textContent = message.createdAt
        ? new Date(message.createdAt).toLocaleString("en-IN")
        : "Date unavailable";

    card.appendChild(top);
    card.appendChild(messageText);
    card.appendChild(date);

    // Mark as Read button
    if (message.status !== "Read") {

        const readButton = document.createElement("button");
        readButton.textContent = "Mark as Read";
        readButton.className = "refresh-btn";

        readButton.addEventListener("click", async function() {

            try {

                const response = await fetch(
                    `http://localhost:3000/api/messages/${message._id}/read`,
                    {
                        method: "PATCH"
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message);
                }

                alert("Message marked as Read!");

                loadMessages();

            } catch (error) {

                alert(error.message || "Could not update message.");
                console.error(error);

            }

        });

        card.appendChild(readButton);
    }

    messagesContainer.appendChild(card);

});


            } catch (error) {

                messagesContainer.innerHTML =
                    '<p class="error">Unable to load messages. Please check your backend server.</p>';

                console.error(error);

            }
        }

        // Load messages automatically
        loadMessages();

    </script>

</body>
</html>
